name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: fmt, validate, lint, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      # No backend and no credentials: the child modules come from public git
      # repositories and the provider plugin from the registry. Nothing here
      # talks to AWS.
      - name: terraform init
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate -no-color

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.65.0

      - name: tflint
        run: |
          tflint --init
          tflint --recursive --no-color

      # The suite runs plan-only against a mocked AWS provider, so it needs no
      # account and costs nothing. It is the only gate that actually checks the
      # baseline still says what it claims to say.
      - name: terraform test
        run: terraform test -no-color
